name: Fetch Commons player images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Fetch open-licensed player images
        run: python fetch_commons_player_images.py --input players_top200.csv --limit 200

      - name: Commit generated assets
        run: |
          git config user.name "ninecat-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images/players player-images.js player-images.json photo-credits.html commons-image-report.csv
          git diff --cached --quiet && exit 0
          git commit -m "Add Wikimedia Commons player images"
          git push
